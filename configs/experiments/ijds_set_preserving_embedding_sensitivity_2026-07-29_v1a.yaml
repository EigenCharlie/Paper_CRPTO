schema_version: "2026-07-29.2"
protocol_status: "locked_candidate_two_phase_before_execution"
protocol_tag: "protocol/ijds-set-preserving-embedding-sensitivity-2026-07-29-v1a"
run_tag: "ijds-set-preserving-embedding-sensitivity-2026-07-29-v1a"

hypothesis: >-
  Policy sensitivity to the numeric conformal upper endpoint can persist even
  when every binary prediction set is held exactly fixed; a complete theta by
  gamma grid under both rulers measures that embedding dependence without
  selecting a coordinate, ruler, direction, or policy.

