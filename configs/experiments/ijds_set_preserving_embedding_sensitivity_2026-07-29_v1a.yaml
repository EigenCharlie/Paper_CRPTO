  raw_sha256: "5878af2a088f8ab5214c9337289fb8b5eb6c6338fd3f417b6cdc18513dc6f35f"
  allowed_raw_columns: ["id", "loan_amnt", "int_rate", "purpose"]
  forbidden_tokens: ["status", "outcome", "default", "pymnt", "realized", "miscoverage"]
  retained_decision_columns:
    - "id"
    - "issue_d"
    - "design_split"
    - "pd_point"
    - "loan_amnt"
    - "purpose"
    - "contractual_rate"
  discarded_coverage_control_columns: []
  chunksize: 100000

outcomes:
  parent_config: "configs/experiments/ijds_binary_geometry_frontier_v4_2026-07-15_v5.yaml"
  raw_path: "data/raw/Loan_status_2007-2020Q3.csv"
  raw_sha256: "5878af2a088f8ab5214c9337289fb8b5eb6c6338fd3f417b6cdc18513dc6f35f"
  evaluated_role: "primary_oot"
  endpoint: "terminal_default_reconstructed_as_observable_by_2020-09-30"
  joined_columns: ["snapshot_default", "snapshot_resolution"]

normalization:
  capital_source: "parent_policy_budget"
  committed_budget_per_period: 1000000.0
  monthly: "parent_committed_budget"
  pooled: "period_count_times_parent_committed_budget"
  common_across_policies: true
  solver_allocated_capital_renormalization: "forbidden"

embedding:
  definition: "keep_u_at_one_else_convex_combination_of_u_and_p"
  theta_grid: [0.0, 0.25, 0.50, 0.75, 1.0]
  binary_support: [0, 1]
  lower_endpoint: "unchanged"
  exact_set_preservation_required: true

frontier:
  roles: ["policy_development", "primary_oot"]
  expected_development_months: 11
  expected_primary_months: 15
  expected_windows: 8
  gamma_grid: [0.0, 0.25, 0.50, 0.75, 1.0]
  coordinate_grid: [0.25, 0.50, 0.75]
  rulers: ["objective_matched", "normalized_score"]
  normalized_score:
    definition: "score_min_plus_coordinate_times_score_at_objective_minus_score_min"
    minimum_score_range: 1.0e-4
    cap_residual_tolerance: 1.0e-8
    minimum_endpoint_retry_slacks: [1.0e-10, 1.0e-9, 1.0e-8]
    minimum_endpoint_retry_failures:
      exact_messages:
        - "Point LP is not optimal: Infeasible."
        - "Point LP is not optimal: Unknown."
      message_prefixes:
        - "Point LP did not fill its budget:"
  objective_matched:
    definition: "score_minimizer_subject_to_one_common_25_score_plugin_objective_floor"
    common_lower_endpoint: "maximum_minimum_score_portfolio_objective_over_all_theta_gamma"
    minimum_objective_range_dollars: 1.0e-4
    floor_residual_tolerance_dollars: 1.0e-5
  objective_optimum:
    diagnostic: "nonbasic_reduced_costs_plus_reversed_id_order"
    dual_tolerance: 1.0e-7
    primal_tolerance: 1.0e-8

solver:
  primary: "highspy_exact_budget_simplex"
  threads: 1
  time_limit_seconds: 300
  allocation_tolerance: 1.0e-8
  allocation_reconciliation_tolerance_dollars: 1.0e-8
  weight_reconciliation_tolerance: 1.0e-12
  contribution_reconciliation_tolerance_dollars: 1.0e-8
  budget_residual_tolerance_dollars: 1.0e-4
  order_rule: "ascending_id_vs_descending_id"
  order_audit_scope: "all_25_primary_cells_all_rulers_coordinates"
  order_exposure_distance_tolerance: 1.0e-10
  order_objective_tolerance_dollars: 1.0e-5
  negative_control_exposure_distance_tolerance: 1.0e-12
  negative_control_objective_tolerance_dollars: 1.0e-8
  negative_control_score_tolerance: 1.0e-12
  independent_validation:
    solver: "ortools_glop"
    periods: ["2016-04", "2016-11", "2017-06"]
    scope: "all_25_cells_all_windows_rulers_coordinates"
    objective_rate_tolerance: 1.0e-7
    weighted_score_tolerance: 1.0e-7

contrasts:
  families:
    - "gamma_1_minus_gamma_0_within_theta"
    - "theta_minus_theta_0_within_gamma"
  gamma_endpoints: [1.0, 0.0]
  theta_reference: 0.0
  negative_control_gamma: 0.0
  common_outcome_assignment: "loanwise_sharp_on_funded_union"
  window_aggregation: "pool_15_month_numerators_before_rates"
  expected_objective_negative_control_tolerance_dollars: 1.0e-8
  payoff_negative_control_tolerance_dollars: 1.0e-8
  rate_negative_control_tolerance: 1.0e-12

metrics:
  standardized_payoff:
    lower: "realized_payoff_difference_lower"
    upper: "realized_payoff_difference_upper"
    direction_tolerance: 1.0e-4
  funded_default:
    lower: "weighted_default_difference_lower"
    upper: "weighted_default_difference_upper"
    direction_tolerance: 1.0e-10
  funded_binary_miscoverage:
    lower: "weighted_miscoverage_difference_lower"
    upper: "weighted_miscoverage_difference_upper"
    direction_tolerance: 1.0e-10

