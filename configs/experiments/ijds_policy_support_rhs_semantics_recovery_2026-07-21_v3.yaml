hypothesis: >-
  After interpreting HiGHS row ranging according to the risk-row basis status
  and replaying every one of the 196 outcome-free midpoint seeds that occupies
  an initial positive gap, the union of fresh basis intervals covers the locked
  [0.05, 0.12] support at tolerance 1e-10; this does not imply exact symbolic
  optimal-face uniqueness, allocation continuity, or a selected policy.

