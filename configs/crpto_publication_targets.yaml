  method:
    prediction: >-
      CatBoost/Platt is the only portfolio score. Numeric logistic, monotonic
      CatBoost, platform-signal WOE/IV, and pricing-excluded application WOE/IV
      are coverage-only controls and cannot be selected from OOT outcomes. A
      separate closed retrospective sensitivity compares Platt, isotonic, beta,
      and Venn--Abers maps on the same frozen CatBoost base score without
      selecting a calibrator or feeding an alternative map into optimization.
    conformal: >-
      Five score strata are fixed from 2011 scores. Exact binary-outcome
      residual ranks are reported for all eight eligible six-month windows;
      the complete 175-cell adjacent-threshold response is evaluated on one
      common fixed target panel with sharp shared-completion bounds;
      a separate combined-rank diagnostic audits the stronger within-stratum
      joint-block exchangeability null using the known finite-batch
      Beta--Binomial law with tie-safe and unresolved-completion adaptations,
      and a complete label-Mondrian sensitivity reports all
      400 score-stratum-by-label categories. An observed-only fit and three
      declared completion rules stress labels unavailable at fit time.
      A complete residual-ECDF frontier compares both one-sided discrepancies
      cellwise under shared binary endpoint completions, without a KS test or
      stochastic-order claim. Five marginal score-minus-prevalence identified
      sets are reported without ranking the learners.
    decision: >-
      Gamma {0,.25,.50,.75,1} is evaluated under objective-matched and
      normalized-score rulers at {.25,.50,.75}; gamma 1 minus gamma 0 is the
      frozen endpoint contrast, with no selector. A separate complete-catalog
      audit compares the maximum loss over all 240 frozen policies in each
      development and target block; it does not assert that every policy
      deteriorates. The active set-preserving grid separates unchanged binary
      sets from allocation and endpoint-direction sensitivity without selecting
      an embedding. Exact global score-order invariance requires positive-affine
      equivalence on the feasible-difference span; no archive-wide non-affinity
      audit or per-cell change theorem is claimed.
    comparator: >-
      C0, C1, C2, registered finite development-admissible support, and the
      registered [0.05,0.12] audit range are outcome-free diagnostics. Outcome
      envelopes are
      exact over their finite cap endpoints. Active-upper solver-reported RHS
      ranges, zero-dual basic-row safe rays, and 196 V2 midpoint seeds
      retrospectively registered in V3a numerically cover the declared RHS range
      at tolerance 1e-10 without an optimal-face uniqueness or
      continuous-allocation claim.
    endpoint: >-
      Terminal status is conservatively reconstructed as observable by the
      cutoff; later terminal statuses and nonterminal rows remain unresolved.
    payoff: >-
      Plug-in (1-p)r-p*LGD and status-indexed standardized proxy
      (1-Y)r-Y*LGD; neither is a cash-flow return, IRR, NPV, or welfare measure.
    allocation_granularity: >-
      The portfolio is a continuous linear-program relaxation. A deterministic
      USD 25 floor-with-cash diagnostic measures implementation granularity but
      does not define or optimize an integer policy.
    funded_selection_estimands: >-
      Count-selected, invested-dollar-selected, and fixed-capital coverage are
      kept as distinct fixed-support estimands. Their sharp shared-completion
      contrasts do not establish funded-set validity, FCR control, or a
      preferred weighting rule.

