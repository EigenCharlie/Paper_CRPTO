claim_boundaries:
  required:
    - "Observed binary-endpoint residual interval, not a latent-PD confidence interval."
    - "Five coverage controls, one portfolio learner, and no OOT model winner."
    - "Overlapping windows and repeated allocations are not independent replications."
    - "Sharp bounds are partial identification, not confidence intervals."
    - "Retrospective contrasts are not causal, prospective, or confirmatory."
    - "The archive is not a verified point-in-time snapshot."
    - "The status-indexed payoff proxy is not cash-flow return, NPV, IRR, or welfare."
    - "Fit-label scenarios are declared stresses, not sharp bounds over all assignments."
    - "USD 25 floor rounding is a diagnostic, not an optimized integer policy."
    - "Finite-archive shortfall is distinct from a joint-block rank-reference flag."
    - "The exact rank tail is retrospective and post-inspection; its locked Bonferroni--Holm cutoffs are nominal reporting thresholds, not post-selection FWER control."
    - "Joint-block exchangeability is stronger than the usual calibration-plus-one-future-point split-conformal condition."
    - "Label-Mondrian is a complete sensitivity, not restored temporal validity."
    - "Adjacent threshold response uses one common target panel and one shared unresolved completion per loan; separately extremized coverage bounds are not subtracted."
  forbidden:
    - "Selected model, gamma, ruler, coordinate, cap, comparator, or policy."
    - "Universal portfolio direction or selected-set conformal guarantee."
    - "Conformal theorem failure inferred from a realized coverage endpoint alone."
    - "Exchangeability established by a nonflag, usual pointwise split-conformal validity refuted by a joint-block flag, or a shift cause identified by a flag."
    - "Markov, deployment, causal, or fair-lending certificate."

