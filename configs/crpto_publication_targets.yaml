executed_quarantine_capsule:
  status: "hash_bound_dirty_tree_executions_never_active_paper_evidence"
  active_paper_evidence_allowed: false
  active_claim_support_allowed: false
  machine_readable_supplement_allowed: false
  dvc_pointer_count_change_allowed: false
  promotion_rule: >-
    Commit and tag the protocol, configuration, runner, and implementation first;
    then execute fresh run tags into new immutable output paths from a clean tree.
    Only that fresh lineage may be considered for active-paper promotion.
  known_reuse_blockers:
    - output_filenames_are_not_contained_or_unique_in_the_executed_runners
    - one_class_no_interleaving_is_marked_true_in_the_executed_v6_helper
    - conformal_group_is_cast_before_exact_integrality_validation
    - v6_selects_a_catboost_stratum_transition_not_declared_by_its_protocol
    - poisson_binomial_reference_omits_a_joint_conditional_independence_assumption
    - shared_io_and_provenance_helpers_were_not_fully_hash_bound_at_execution
  known_reuse_blocker_scope:
    - ijds-binary-phase-geometry-2026-07-26-v6
    - ijds-postfreeze-derived-diagnostics-2026-07-26-v1
  quarantined_run_scope:
