name: clean-clone-reproducibility

# Manually triggered clean-clone audit. It reconstructs the evidence and
# reviewer surfaces on a disposable Windows CPU runner. The evidence figures
# are compared byte-for-byte, so the runner deliberately matches the operating
# system on which the canonical publication generation is produced.
# It remains manual because it downloads authenticated DVC artifacts and runs
# the complete suite; the lightweight lint workflow covers ordinary pushes.
#
# Trigger it from the GitHub UI (Actions > clean-clone-reproducibility).
# Use it after a major scientific refactor and as a pre-freeze reproducibility
# audit. It does not compile or enforce the final reviewer-PDF page budget;
# `just submission-freeze-check` remains the explicit final-only gate.
#
# Required repository secrets:
# - DAGSHUB_USER_TOKEN
# - DAGSHUB_TOKEN
# - DAGSHUB_USER
# - DAGSHUB_REPO (= Paper_CRPTO)

on:
  workflow_dispatch:

concurrency:
  group: clean-clone-reproducibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ENDPOINT_URL: https://dagshub.com/EigenCharlie94/Paper_CRPTO.s3
      CRPTO_REQUIRE_DVC_ARTIFACTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          prune-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.56.0"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.9.38"

      - name: Set up Python
        run: uv python install 3.11.15

      - name: Sync deps
        run: uv sync --group dev --locked

      - name: Dependency audit
        run: just dependency-audit

      - name: Pull publication DVC capsule
        run: just ijds-pull-publication

      - name: Active DVC-materialized IJDS contract
        run: just ijds-active-dvc-tests

      - name: Protected extraction hash regression
        run: uv run --locked pytest tests/test_manifest_regression.py -v

      - name: Strict protected-artifact gate
        run: just validate-champion-strict

      - name: Rebuild derived policy-support evidence
        run: |
          just ijds-tie-evidence ijds-policy-support-evidence
          git diff --exit-code -- `
            reports/crpto/ijds_policy_support_tie_evidence.json `
            reports/crpto/ijds_policy_support_optimal_face_evidence.json `
            reports/crpto/tables/crpto_ijds_policy_family_domain.csv `
            reports/crpto/tables/crpto_ijds_gamma_endpoint_audit.csv `
            reports/crpto/tables/crpto_ijds_comparator_support_domain.csv `
            docs/research/ijds_policy_support_tie_results_2026-07-12.md

      - name: Rebuild publication evidence from the pulled DVC capsule
        run: |
          uv run --locked python scripts/build_ijds_binary_geometry_frontier_v4_evidence.py `
            --stage-only staging/ci-active-evidence
          uv run --locked python scripts/build_ijds_binary_geometry_frontier_v4_evidence.py `
            --verify-stage-against-canonical staging/ci-active-evidence

      - name: Rebuild deterministic reviewer surfaces
        run: just paper-body paper-supplement paper-tex paper-machine-supplement

      - name: Generated-surface freshness and committed-TeX gate
        run: |
          just paper-tex-check paper-machine-supplement-check
          git ls-files --error-unmatch -- `
            paper/submission/CRPTO_ijds_machine_readable_supplement.zip
          git diff --exit-code -- `
            paper/submission/CRPTO_ijds_submission.tex `
            paper/submission/CRPTO_ijds_machine_readable_supplement.zip

      - name: Optimized-runtime guard
        run: |
          $env:PYTHONOPTIMIZE = "2"
          uv run --locked pytest tests/test_operational_guardrails.py::test_runtime_python_has_no_optimized_away_assert_guards -v

      - name: Active IJDS contract
        run: just ijds-active-check

      - name: Active implementation and evidence drift gate
        run: just drift-gate

      - name: Full author tests
        run: just coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output
          path: |
            coverage.xml
            .pytest_cache/
          retention-days: 7
          if-no-files-found: ignore
