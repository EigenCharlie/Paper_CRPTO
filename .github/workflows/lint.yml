name: lint

on:
  pull_request:
  push:
    branches: [main, paper-final]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.11.15

      - name: Sync quality dependencies
        run: uv sync --only-group quality --locked

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check . --exclude "scripts/experiments/run_ijds_decision_catalog_transport_v1.py,scripts/experiments/run_ijds_funded_selection_estimand_audit_v1.py,scripts/experiments/run_ijds_marginal_mean_score_outcome_gap_v3i.py,scripts/experiments/run_ijds_residual_transport_frontier.py,src/ijds_audit/marginal_mean_score_outcome_gap_v3i.py,scripts/experiments/run_ijds_score_equivalence_complete_hull_v1.py,src/ijds_audit/score_equivalence_complete_hull.py,scripts/experiments/run_ijds_set_native_binary_robust_counterpart_v1.py,src/ijds_challengers/set_native_binary_robust.py,scripts/experiments/run_ijds_dual_coefficient_binary_set_native_v1.py,src/ijds_challengers/dual_coefficient_binary_set_native.py,scripts/experiments/run_ijds_binary_phase_census_v1.py,src/ijds_audit/binary_phase_census.py"
